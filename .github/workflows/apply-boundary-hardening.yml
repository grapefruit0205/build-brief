name: Apply Boundary Hardening

on:
  push:
    branches: [hardening-enforcement-boundaries]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: hardening-enforcement-boundaries
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Apply focused hardening
        run: python scripts/apply_boundary_hardening.py
      - name: Discover deterministic test count
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -q 2>&1 | tee /tmp/click-tests.txt
          python - <<'PY'
          from pathlib import Path
          import re
          output = Path('/tmp/click-tests.txt').read_text(encoding='utf-8')
          match = re.search(r'Ran (\d+) tests?', output)
          if not match:
              raise SystemExit('could not determine deterministic test count')
          count = match.group(1)
          for name in ('README.md', 'README.ko.md', 'RELEASE_NOTES.md'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if '__TEST_COUNT__' not in text:
                  raise SystemExit(f'missing test-count placeholder in {name}')
              path.write_text(text.replace('__TEST_COUNT__', count), encoding='utf-8')
          print(f'deterministic tests: {count}')
          PY
      - name: Re-run deterministic suite after documentation update
        run: python -m unittest discover -s tests -q
      - name: Validate Python and diff
        shell: bash
        run: |
          python -m py_compile hooks/click_gate.py tests/test_click_gate.py
          git diff --check
          ! grep -R '__TEST_COUNT__' README.md README.ko.md RELEASE_NOTES.md
      - name: Commit hardened candidate
        shell: bash
        run: |
          git rm .github/workflows/apply-boundary-hardening.yml scripts/apply_boundary_hardening.py
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Harden remaining enforcement boundaries'
          git push origin HEAD:hardening-enforcement-boundaries
