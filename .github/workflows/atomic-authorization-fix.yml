name: Atomic Authorization Patch

on:
  push:
    branches: [hardening-enforcement-boundaries]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: hardening-enforcement-boundaries
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Apply atomic authorization patch
        run: python scripts/atomic_authorization_patch.py
      - name: Run deterministic suite
        run: python -m unittest discover -s tests -q
      - name: Validate Python and diff
        shell: bash
        run: |
          python -m py_compile hooks/click_gate.py tests/test_click_gate.py
          git diff --check
      - name: Commit atomic hardening
        shell: bash
        run: |
          git rm -f .github/workflows/atomic-authorization-fix.yml scripts/atomic_authorization_patch.py
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Serialize bypass and cancel authorization consumption'
          git push origin HEAD:hardening-enforcement-boundaries
