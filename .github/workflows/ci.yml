name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Validate plugin, marketplace, and Click/Fix skills
        if: runner.os == 'Linux'
        run: python scripts/validate_distribution.py
      - name: Compile Python sources
        if: runner.os == 'Linux'
        run: python -m compileall -q hooks evals scripts tests
      - name: Check whitespace errors
        if: runner.os == 'Linux'
        run: git diff --check
      - name: Run deterministic Hook, grader, and repository-policy tests
        run: python -m unittest discover -s tests -v
