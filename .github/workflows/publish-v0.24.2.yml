name: Publish Click v0.24.2

on:
  push:
    branches:
      - ops/publish-v0.24.2

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.24.2
      TARGET_SHA: 7d743ef2ba3e9fbd83b1f8428f86e2659df1ebbd
    steps:
      - name: Verify exact release target and required gates
        shell: bash
        run: |
          set -euo pipefail

          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "${main_sha}" != "${TARGET_SHA}" ]]; then
            echo "main moved: expected ${TARGET_SHA}, got ${main_sha}" >&2
            exit 1
          fi

          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&event=push&per_page=20")"
          ci="$(jq -r '[.workflow_runs[] | select(.name == "CI")][0].conclusion // ""' <<<"${runs}")"
          security="$(jq -r '[.workflow_runs[] | select(.name == "Plugin Security Scan")][0].conclusion // ""' <<<"${runs}")"

          if [[ "${ci}" != "success" ]]; then
            echo "CI is not successful for ${TARGET_SHA}: ${ci}" >&2
            exit 1
          fi
          if [[ "${security}" != "success" ]]; then
            echo "Plugin Security Scan is not successful for ${TARGET_SHA}: ${security}" >&2
            exit 1
          fi

      - name: Create immutable release tag target
        shell: bash
        run: |
          set -euo pipefail

          existing_ref=""
          if existing_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" 2>/dev/null)"; then
            existing_ref="$(jq -r '.object.sha' <<<"${existing_json}")"
          fi

          if [[ -n "${existing_ref}" ]]; then
            target="${existing_ref}"
            if tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${existing_ref}" 2>/dev/null)"; then
              target="$(jq -r '.object.sha' <<<"${tag_json}")"
            fi
            if [[ "${target}" != "${TARGET_SHA}" ]]; then
              echo "${TAG} already exists but does not target ${TARGET_SHA}" >&2
              exit 1
            fi
            echo "${TAG} already targets ${TARGET_SHA}; keeping it."
            exit 0
          fi

          tag_object="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="${TAG}" \
            -f message="Click v0.24.2" \
            -f object="${TARGET_SHA}" \
            -f type="commit" \
            --jq '.sha')"

          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="${tag_object}" >/dev/null

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists."
            exit 0
          fi

          cat > release-notes.md <<'EOF'
          Click v0.24.2 is a focused Windows Codex hook-launch compatibility patch.

          ## Highlights

          - Windows lifecycle hook commands now use Codex's `${PLUGIN_ROOT}` template instead of the cmd-style `%PLUGIN_ROOT%` form.
          - The Windows CI suite executes all four lifecycle hook commands through PowerShell from both a normal plugin root and a plugin root containing spaces.
          - SessionEnd remains capped at the host-supported three-second maximum introduced in v0.24.1.
          - Contract shape, evidence protocol, Always ON / Manual modes, and runtime authorization rules are unchanged.
          - This release does not claim to fix host paths that fail to dispatch the matching PreToolUse event at all; that remains a separate host compatibility boundary.

          ## Validation

          The exact tagged commit `7d743ef2ba3e9fbd83b1f8428f86e2659df1ebbd` passed:

          - deterministic CI on Ubuntu, macOS, and Windows
          - repository distribution validation, Python compilation, and `git diff --check`
          - Plugin Security Scan

          ## Upgrade

          ```bash
          codex plugin marketplace upgrade click
          codex plugin add click@click
          ```

          Restart the desktop app, review and trust the updated Click Hook, and begin a new task. Do not reuse a pending runner command created by an older installation.
          EOF

          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Click v0.24.2" \
            --notes-file release-notes.md \
            --latest
