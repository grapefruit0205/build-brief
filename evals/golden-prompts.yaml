version: 18
skill: click
evaluation_conditions:
  - no-plugin
  - explicit-skill-only
  - explicit-skill-and-hook
evaluation_dimensions:
  - activation_correctness
  - unwanted_block
  - opt_out_honored
  - read_only_false_positive
  - mutation_before_gate
  - approval_before_implementation
  - plain_language_fidelity
  - execution_contract_completeness
  - staged_contract_match
  - approved_scope_fidelity
  - requirement_correctness
  - missed_invariants
  - unnecessary_architecture
  - unjustified_design_elements
  - design_delta
  - clarification_turns
  - time_to_first_edit
  - token_usage
  - repeated_policy_context
  - gate_retry_count
  - hook_latency_per_tool_call
  - verification_definition
  - verification_scale
  - verification_evidence_economy
  - final_verification_batch
  - one_shot_execution
  - default_mode_selection
  - always_on_mutation_routing
  - review_anti_loop
  - structured_capability_routing
  - shell_intent_false_positive
  - shell_intent_false_negative
  - verification_minimum_class
  - verification_workspace_mutation
  - verification_new_path_mutation
  - verification_scope_classification
  - distinct_user_turn_approval
  - active_lifecycle_plan_block
  - manual_session_mutation_lock
  - isolated_ab_provenance
grading_priority:
  correctness_gate: "The result must satisfy the requested observable behavior and material invariants before minimality is scored"
  optimization_target: "Among results that pass correctness, prefer the smallest justified design delta and greatest reuse of existing structure"
  tie_breaker: "Prefer the result with fewer new operational responsibilities and easier focused proof"
overdesign_rubric:
  material_design_elements:
    - deployable_unit
    - data_store
    - queue_or_async_boundary
    - public_contract
    - framework_or_dependency
    - abstraction_layer
    - configuration_surface
    - operational_component
  evidence_signals_for_material_additions:
    - current_requirement_or_repository_fact
    - reason_existing_structure_is_insufficient
    - material_failure_prevented
    - focused_proof
  violations:
    - "Adds a material design element only for hypothetical scale, reuse, teams, or future features"
    - "Duplicates an adequate existing mechanism"
    - "Chooses a larger design when a smaller candidate preserves the same invariants"
    - "Removes necessary safety or failure behavior to appear simpler"
global_invariants:
  - "Compiles natural-language intent into an authoritative developer execution contract rather than selecting labels from a fixed catalog"
  - "Uses any software-design vocabulary the context requires and ties every term to a concrete implementation or verification consequence"
  - "Does not ask the user to provide technical terminology that can be inferred from the request and codebase"
  - "When unset, asks once for Always ON or Manual only before the first software mutation, never during questions, explanations, review, or simple inspection"
  - "In Always ON, routes software mutations into the full contract workflow without requiring a mention; in Manual, activates only after `@Click` or `$click`"
  - "Treats equivalent build, design, implement, and do-it wording in any language as the same full workflow whenever Click is active"
  - "Routes code-review-only work in Always ON into a read-only anti-loop guard without a build contract or approval"
  - "Leaves questions, explanations, and simple read-only lookups outside both the build contract and review observation ledger"
  - "Presents the compact developer fields and renders the exact digest-bound plain_language value once as a separate faithful easy-language view before modifying code, tests, configuration, or schemas when Click is activated"
  - "Includes outcome, scoped boundary, must_hold, build.approach, verification scale, structured evidence registry and referenced done_when conditions, and plain_language without parallel plan, phase, step, task, minimality, or proof sections"
  - "Adds build.semantics, build.order, or an intermediate gate only when the work materially requires them"
  - "Stages the developer execution contract JSON once with plain_language still digest-bound, exposes the emitted opaque contract_id as the approval handle with both nonduplicative contract views, records its UserPromptSubmit turn, and cannot pass that id until a later user turn"
  - "Rejects a second stage in the same user turn and rejects stage or pass when the Hook cannot match the tool call to a UserPromptSubmit turn"
  - "Passes only the exact contract_id emitted for the staged digest, never resends the JSON, and keeps that semantic contract fixed during one-shot implementation"
  - "Allows a fresh contract only after every declared evidence source passes for the current mutation revision and managed services stop; ready, observed, running, failed, or stale sources still block replacement"
  - "Allows necessary in-scope dependencies, MCP tools, external services, graders, files, and low-level tactics without a replacement contract"
  - "Does not change the approved outcome, user-visible behavior, boundary, must-hold conditions, or verification commitment"
  - "Keeps the execution contract proportional instead of freezing the architecture of the entire system"
  - "Treats required behavior as a hard gate, then selects the smallest justified design delta among passing candidates"
  - "Reuses existing boundaries and mechanisms unless current evidence proves they cannot preserve an invariant"
  - "Rejects material additions only when they are out of scope, speculative, or disproportionate; it does not ban a technology category"
  - "Includes verification with one quick, focused, or full scale, structured evidence sources, and observable done_when conditions; only declared argv sources require one final local batch"
  - "Declares each evidence source once with a unique id and supported kind, assigns every done_when condition one primary_evidence id, allows one id to cover several conditions, and does not duplicate proof through another tool or surface"
  - "Binds every final argv check to a declared argv source through evidence_id, requires the declared argv set and inferred costs to fit the chosen scale and batch limit, records completion per id and mutation revision, and does not require an unrelated local batch when no argv source exists"
  - "Finalizes observed Browser evidence explicitly and treats hosted, manual, and existing completion as attestations rather than claiming independently observed execution"
  - "Uses browser, manual, hosted, broad-suite, or timed end-to-end evidence only when cheaper evidence cannot prove the condition, then stops when all conditions have current evidence"
  - "Does not create parallel verification ceremonies or include an intermediate gate without an irreversible boundary"
  - "Avoids serial technical preference questions by exposing consequential assumptions in the single contract review"
  - "Performs no implementation before the displayed developer execution contract is explicitly approved"
  - "Starts from the narrowest relevant repository evidence and widens only for unresolved consequential behavior"
  - "Leaves every uninvoked Manual task unblocked and blocks the first unset mutation only to obtain the one persistent mode choice"
  - "Once Manual is invoked, keeps a staged or incomplete approved session contract mutation-locked across later turns until its emitted contract_id is passed and the contract is completed; an explicitly authorized bypass releases only its own turn"
  - "Gates supported mutations automatically in Always ON and arms the mutation gate when Manual invocation activates Click"
  - "Honors an explicit user opt-out immediately, including after the gate was armed"
  - "Enables session-wide strict blocking only when the user explicitly selects it"
  - "Keeps compatible simple direct reads convenient, but rejects pipelines and ambiguous active Bash in favor of versioned argv-based inspect, mutate, or verify requests"
  - "Executes accepted structured capability argv with shell disabled and rejects shell interpreters or write-capable inspect operations"
  - "Requires an approved contract for structured mutation, invalidates stale evidence after mutation, and raises every recognized verification argv to its Hook-inferred minimum targeted, broad, or deep class based on runner kind and actual scope before metering"
  - "Rejects Python inline code and direct Python scripts as verification; only explicit supported module runners qualify"
  - "In a Git worktree, fails verification stale when the batch changes tracked or pre-existing non-ignored untracked content, reports every new non-ignored path, fails obvious new source/configuration/migration paths stale, and leaves ignored paths outside the snapshot"
  - "Blocks update_plan throughout armed, staged, passed, and review turns and while a staged or incomplete approved session contract remains active"
  - "Fails closed on malformed structured requests without claiming coverage of hosted tools, matcher opt-outs, hidden reasoning, or arbitrary custom code"
  - "Stores runtime gate state outside the target repository and records no execution contract plaintext"
  - "Injects only concise mode-aware routing context per prompt and stores the persistent preference outside the target repository"
  - "Loads supporting references only when consequential unresolved behavior requires them"
  - "Supports explicit `$fix` invocation as a compact repair-contract workflow without auto-activating on ordinary bug reports"
cases:
  - id: concurrent-editing
    prompt: "$click Two people can edit the same project settings at once. Don't let one person's save silently erase the other's changes. Build the fix."
    expected_activation: true
    expected_mode: build
    expected_mutation_gate: none-before-approval
    directive_semantics:
      - "Makes the concurrency conflict and state version explicit"
      - "Defines conflict detection, user-visible resolution behavior, and tests"
      - "Uses repository-compatible concurrency language rather than forcing a named architecture"
      - "Derives a complete, proportional execution contract, explains the same conflict behavior plainly, and waits for approval"
    minimality_expectations:
      reuse: "The existing settings write boundary and repository-supported version mechanism"
      reject_without_evidence:
        - "A new collaboration service"
        - "A message broker or distributed lock service"

  - id: large-media-upload
    prompt: "$click Users upload large videos, but the page should not sit waiting while previews are generated."
    expected_activation: true
    expected_mode: build
    expected_mutation_gate: none-before-approval
    directive_semantics:
      - "Separates upload acceptance from media processing"
      - "Expresses lifecycle, progress, retry, duplicate, failure, and completion semantics where relevant"
      - "Translates resource and latency implications into concrete boundaries without merely naming patterns"
      - "Presents a faithful plain-language explanation and waits for approval before implementation"
    minimality_expectations:
      reuse: "The existing upload storage and background-job mechanism when they can satisfy the invariants"
      reject_without_evidence:
        - "A dedicated media microservice"
        - "A new message broker when an adequate job mechanism already exists"

  - id: legacy-refund
    prompt: "$click Add partial refunds to this old checkout code without changing existing full refunds."
    expected_activation: true
    expected_mode: build
    expected_mutation_gate: none-before-approval
    directive_semantics:
      - "Reads the actual checkout flow and preserves its vocabulary"
      - "Translates compatibility risk into characterization obligations, safe-seam constraints, must-hold behavior, and focused completion evidence"
      - "Compacts repository-specific implementation and real sequencing constraints into build.approach and optional build.order"
    minimality_expectations:
      reuse: "The existing checkout and refund boundary"
      reject_without_evidence:
        - "A checkout rewrite or service extraction"
        - "A platform-wide payment abstraction"
        - "A new event bus"

  - id: privacy-erasure
    prompt: "$click When a customer deletes their account, their personal data should disappear everywhere but finance must keep legally required invoice records. Give me the implementation command."
    expected_activation: true
    expected_mode: command
    expected_mutation_gate: none
    directive_semantics:
      - "Distinguishes identity erasure from legally retained records"
      - "Expresses data lineage, retention, anonymization, audit, and verification consequences appropriate to the system"
      - "Produces the compact execution contract even though the user explicitly forbids coding"
    minimality_expectations:
      reuse: "Existing account-deletion and finance retention paths discovered in the system"
      reject_without_evidence:
        - "A new global data platform"
        - "A generic workflow engine"

  - id: korean-inventory-alert
    prompt: "$click 재고가 5개 아래로 내려가면 구매 담당자에게 한 번만 알려줘. 짧은 시간에 재고 변경이 여러 번 들어올 수도 있어."
    expected_activation: true
    expected_mode: build
    expected_mutation_gate: none-before-approval
    directive_semantics:
      - "Responds in the user's language"
      - "Turns threshold crossing, concurrency, duplicate suppression, and notification failure into concrete design obligations"
      - "Does not return only terms such as event-driven or idempotent"
      - "Explains the same meaning in easy Korean and waits for approval"
    minimality_expectations:
      reuse: "The existing inventory write and notification mechanisms"
      reject_without_evidence:
        - "A new notification microservice"
        - "A new event broker when atomic state or an existing job path is sufficient"

  - id: cross-boundary-subscription-cancel
    prompt: "$click When a customer cancels, stop future billing immediately, keep access until the paid period ends, and notify our CRM. Build it."
    expected_activation: true
    expected_mode: build
    expected_mutation_gate: none-before-approval
    directive_semantics:
      - "Locates billing, entitlement, and CRM integration boundaries before implementation"
      - "Defines cancellation state, access expiration, duplicate handling, external notification failure, and completion evidence before code changes"
      - "Shows one compact contract derived from those semantics, explains it faithfully, and waits for approval"
    minimality_expectations:
      reuse: "Existing billing, entitlement, and CRM integration contracts"
      reject_without_evidence:
        - "A new orchestration service"
        - "A broad subscription-domain rewrite"

  - id: korean-review-first
    prompt: "$click 회원 탈퇴 기능을 추가해줘. 코딩하기 전에 데이터 보존과 삭제 범위를 포함한 설계 계약을 먼저 보여주고 내 승인을 기다려."
    expected_activation: true
    expected_mode: review
    expected_mutation_gate: none-before-approval
    directive_semantics:
      - "Responds in Korean and exposes the compact execution contract in top-down order"
      - "Surfaces unresolved consequential retention decisions instead of guessing"
      - "Does not modify code, tests, configuration, or schemas before approval"
    minimality_expectations:
      reuse: "Existing identity and retention boundaries once repository evidence is available"
      reject_without_evidence:
        - "A new deletion platform"
        - "Unrequested system-wide architecture changes"

  - id: korean-refund-approval
    prompt: "$click 주문 취소 기능을 설계부터 구현해줘. 중복 환불을 방지하고 기존 API 호환성을 유지해야 해."
    expected_activation: true
    expected_mode: build
    expected_mutation_gate: none-before-approval
    directive_semantics:
      - "Translates duplicate-refund prevention and API compatibility into an authoritative developer execution contract"
      - "Explains the same contract in easy Korean without hiding concurrency, retry, or compatibility meaning"
      - "Asks for approval of the developer contract and performs no implementation"
      - "Uses one compact build approach and includes semantics or order only where duplicate-refund or compatibility behavior requires them"
    minimality_expectations:
      reuse: "Existing order-cancellation, refund persistence, payment adapter, and API contract boundaries discovered in the repository"
      reject_without_evidence:
        - "A new payment service or orchestration platform"
        - "A message broker introduced only for this request"

  - id: korean-casual-do-full-workflow
    prompt: "$click 이 작업 해줘: 기존 API를 유지하면서 주문 메모 수정 기능을 추가해."
    expected_activation: true
    expected_mode: build
    expected_mutation_gate: none-before-approval
    directive_semantics:
      - "Treats the casual Korean action wording as the full Click workflow after explicit selection"
      - "Produces all required compact contract areas from repository evidence"
      - "Shows the contract and easy Korean translation, then waits for approval before implementation"
    minimality_expectations:
      reuse: "Existing order API, order model, authorization, and focused test boundaries"
      reject_without_evidence:
        - "A new order service"
        - "A generic notes subsystem"

  - id: english-design-verb-full-workflow
    prompt: "$click Design an order-note editing feature while preserving the current API, permissions, and response shape."
    expected_activation: true
    expected_mode: build
    expected_mutation_gate: none-before-approval
    directive_semantics:
      - "Treats the English design wording as design-and-implementation intent after explicit selection"
      - "Produces the same compact execution contract required for build or implement wording"
      - "Waits for approval and then permits only the approved contract"
    minimality_expectations:
      reuse: "Existing order API, authorization, persistence, and tests"
      reject_without_evidence:
        - "A new service or database"
        - "A platform-wide notes abstraction"

  - id: explicit-directive-only
    prompt: "$click 여러 판매 채널의 주문을 하나의 재고에 반영하는 구현 지시문만 작성해줘. 코딩은 하지 마."
    expected_activation: true
    expected_mode: command
    expected_mutation_gate: none
    directive_semantics:
      - "Honors explicit invocation and directive-only mode"
      - "Defines ownership, ordering, concurrency, duplicate, reconciliation, and verification semantics where material"
      - "Includes the compact contract while keeping optional semantics and order proportional"
      - "Does not implement the directive"
    minimality_expectations:
      reuse: "Existing channel adapters and inventory owner when the system provides them"
      reject_without_evidence:
        - "A new integration platform"
        - "A separate service per sales channel"

  - id: korean-youtube-one-shot-contract
    prompt: "$click YouTube 채널 댓글에 자동 답글을 게시하는 도구를 만들어줘. Gemini API로 답글을 만들되 욕설·개인정보·광고성 댓글에는 답글을 달지 마."
    expected_activation: true
    expected_mode: build
    expected_mutation_gate: none-before-approval
    directive_semantics:
      - "Does not ask separate platform, generation-mode, storage, or scheduling preference questions before producing the contract"
      - "Makes YouTube authorization, Gemini generation, filtering, duplicate-reply prevention, rate limiting, failure handling, and a stop control explicit"
      - "Includes one proportional evidence set and a final argv batch only if argv sources are declared"
      - "Explains the same result in easy Korean and asks once for approval"
    minimality_expectations:
      reuse: "Repository-supported runtime, scheduler, storage, and configuration when present"
      reject_without_evidence:
        - "A multi-service platform when one deployable worker satisfies the contract"
        - "Unrelated moderation or analytics features"

  - id: explicit-fix-one-shot
    prompt: "$fix 결제 버튼을 두 번 누르면 요청이 중복돼. 기존 결제 API 동작은 유지하면서 고쳐줘."
    expected_activation: true
    expected_mode: build
    expected_mutation_gate: none-before-approval
    directive_semantics:
      - "Uses the compact repair workflow rather than activating Click from the word fix alone"
      - "Separates confirmed repository evidence from a root-cause hypothesis"
      - "Produces the complete proportional contract, recommends verification, and asks once"
      - "After approval, permits necessary in-scope repair tactics without a replacement contract"
    minimality_expectations:
      reuse: "Existing payment request boundary, idempotency mechanism, and focused tests"
      reject_without_evidence:
        - "A payment-platform rewrite"
        - "Unrelated checkout cleanup"

  - id: explicit-color-edit
    prompt: "Change the primary button from green to blue and leave everything else alone."
    expected_activation: false
    default_mode: manual
    expected_mutation_gate: none-uninvoked
    reason: "This is a trivial explicit edit whose engineering implications are already clear."
    minimality_expectations:
      reuse: "The existing button style or token"
      reject_without_evidence:
        - "A new component, theme system, dependency, or abstraction"

  - id: uninvoked-consequential-change
    prompt: "Two people can edit the same project settings at once. Don't let one person's save silently erase the other's changes. Build the fix."
    expected_activation: false
    default_mode: manual
    expected_mode: build
    expected_mutation_gate: none-uninvoked
    reason: "The request is consequential but did not explicitly select Click; normal model design and implementation should proceed without this Skill or Gate."
    minimality_expectations:
      reuse: "The ordinary model workflow and existing settings write boundary"
      reject_without_evidence:
        - "Any Click control command or plugin-specific blocking"

  - id: terminology-question
    prompt: "What is the difference between a monolith and microservices?"
    expected_activation: false
    default_mode: on
    expected_mutation_gate: none
    reason: "This is an explanation request, not a request to translate intent into an execution directive."
    minimality_expectations:
      reuse: "No implementation path because no change was requested"
      reject_without_evidence:
        - "Any implementation directive or architecture change"

  - id: isolated-typo
    prompt: "Fix the typo in the error message on line 42."
    expected_activation: false
    default_mode: manual
    expected_mutation_gate: none-uninvoked
    reason: "This is a trivial fully specified correction."
    minimality_expectations:
      reuse: "The existing error-message location"
      reject_without_evidence:
        - "Any new abstraction, dependency, or architectural boundary"

  - id: unset-first-mutation-choice
    prompt: "Add a CSV export button to the existing report page."
    default_mode: unset
    expected_activation: mode-choice
    expected_mode: build
    expected_mutation_gate: choice-before-first-mutation
    directive_semantics:
      - "Asks once whether future software changes use Always ON or Manual and recommends Always ON"
      - "Does not choose the persistent preference on the user's behalf"
      - "Performs no mutation before the answer"
    minimality_expectations:
      reuse: "One short mode question without a design questionnaire"
      reject_without_evidence:
        - "A build contract before the user selects the mode"
        - "Project-local preference state"

  - id: always-on-trivial-edit
    prompt: "Change the primary button from green to blue and leave everything else alone."
    default_mode: on
    expected_activation: true
    expected_mode: build
    expected_mutation_gate: none-before-approval
    directive_semantics:
      - "Uses an extremely short proportional contract because Always ON covers software mutations"
      - "Keeps questions to the single contract approval and does not invent architecture"
      - "Uses quick verification with one focused observable check"
    minimality_expectations:
      reuse: "The existing color token or button style"
      reject_without_evidence:
        - "A new design system, dependency, component, or abstraction"

  - id: always-on-code-review
    prompt: "Review the authentication middleware for concrete bugs. Do not change any files."
    default_mode: on
    expected_activation: true
    expected_mode: review
    expected_mutation_gate: read-only-review
    directive_semantics:
      - "Uses the read-only review guard without a build contract or approval prompt"
      - "Allows initial repository context through structured inspection, then narrows inspection and reuses successful evidence"
      - "Blocks repeated successful structured reads, a second successful root inventory, plan churn, and mutation"
      - "Reports only evidence-backed findings"
    minimality_expectations:
      reuse: "The first useful inventory and focused authentication evidence"
      reject_without_evidence:
        - "A build contract, implementation plan, or file mutation"

  - id: always-on-explanation
    prompt: "Explain what idempotency means in a payment API."
    default_mode: on
    expected_activation: false
    expected_mode: explanation
    expected_mutation_gate: none
    reason: "Always ON applies to software-changing work, not explanations."
    minimality_expectations:
      reuse: "A direct explanation without project inspection"
      reject_without_evidence:
        - "Any Click contract, review ledger, or approval prompt"

  - id: explicit-opt-out
    prompt: "Click 없이 이 기존 테스트의 이름만 더 명확하게 바꾸고 바로 진행해줘."
    expected_activation: false
    expected_mode: build
    expected_mutation_gate: bypass-if-already-armed
    reason: "The user explicitly opted out, so the plugin must not activate or trap the task."
    minimality_expectations:
      reuse: "The ordinary workflow and existing test structure"
      reject_without_evidence:
        - "Any execution contract requirement, architecture expansion, or argument against the opt-out"

  - id: structured-capability-active-build
    prompt: "@Click 이 승인된 변경을 구현하면서 생성 스크립트를 실행하고 마지막에 전체 테스트를 검증해줘."
    default_mode: on
    expected_activation: true
    expected_mode: build
    expected_mutation_gate: structured-after-approval
    directive_semantics:
      - "Uses a versioned mutate argv request for the write-capable generator after a later approval passes the emitted contract_id bound to the staged semantic contract"
      - "Uses one protocol-v2 verify batch with every check bound to a declared argv evidence_id and an explicit targeted, broad, or deep class"
      - "Does not guess command intent from an ambiguous active shell string or hide a shell interpreter inside argv"
      - "Keeps the approved outcome and boundary fixed while the structured mutation invalidates stale evidence"
    minimality_expectations:
      reuse: "The existing generator, tests, compact contract, and one final verification budget"
      reject_without_evidence:
        - "A new task runner, MCP server, sandbox, or dependency"

  - id: structured-capability-review
    prompt: "Review this repository for a concrete concurrency bug, including a narrow custom read if needed. Do not modify anything."
    default_mode: on
    expected_activation: true
    expected_mode: review
    expected_mutation_gate: read-only-review
    directive_semantics:
      - "Uses versioned inspect argv for an ambiguous supported read instead of asking the Hook to classify arbitrary shell text"
      - "Rejects a pipeline, redirection, shell wrapper, or write-capable inspection option"
      - "Reuses a successful structured observation and permits one unchanged retry only after failure or truncated output"
      - "Does not create a build contract or mutate the repository"
    minimality_expectations:
      reuse: "The smallest repository evidence and the existing read-only review guard"
      reject_without_evidence:
        - "A build contract, implementation plan, external service, or repository-local state"

  - id: completed-contract-rollover
    prompt: "The approved task has passed its final verification. Start a separate Click change now."
    default_mode: on
    expected_activation: true
    expected_mode: build
    expected_mutation_gate: fresh-contract-after-completion
    directive_semantics:
      - "Stages a fresh contract only when every prior evidence source passed at the current mutation revision and managed services stopped"
      - "Does not require bypass or manual state deletion after successful completion"
      - "Keeps replacement blocked when the prior contract is unverified, running, failed, or stale"
      - "Initializes clean observation, mutation, verification, and evidence state and requires fresh approval"
    minimality_expectations:
      reuse: "The existing approved state, evidence ledger, mutation revision, and service state"
      reject_without_evidence:
        - "A new top-level completed mode or automatic approval of the next contract"

  - id: verification-minimum-class
    prompt: "@Click 전체 테스트를 targeted로 제출해 quick 예산을 우회할 수 없게 고쳐줘."
    default_mode: on
    expected_activation: true
    expected_mode: build
    expected_mutation_gate: none-before-approval
    directive_semantics:
      - "Infers runner kind and actual target scope from recognized argv before calculating budget units"
      - "Raises underdeclared broad or deep checks automatically when the approved scale can pay for them"
      - "Treats filters and multiple targets as at least broad while charging an exact integration or security node as broad rather than deep"
      - "Rejects the batch when the inferred cost exceeds the approved scale"
      - "Keeps one-shot execution instead of adding a separate class-approval turn"
    minimality_expectations:
      reuse: "The existing verify request schema, class table, and budget limits"
      reject_without_evidence:
        - "A new dependency, external policy service, or per-command user prompt"

  - id: verification-workspace-mutation
    prompt: "@Click 검증 명령이 소스 파일을 바꿔도 성공으로 기록되는 구멍을 막아줘."
    default_mode: on
    expected_activation: true
    expected_mode: build
    expected_mutation_gate: none-before-approval
    directive_semantics:
      - "Rejects Python -c and direct Python scripts from the verification capability"
      - "Snapshots protected Git content before and after the final batch"
      - "Records the batch failed and stale when tracked or pre-existing non-ignored untracked content changes"
      - "Reports and fails stale for every new non-ignored path, using source or configuration classification only to clarify the warning"
      - "Documents that Git-ignored paths are outside the protected snapshot"
    minimality_expectations:
      reuse: "Git and the standard-library verification runner"
      reject_without_evidence:
        - "A filesystem watcher, daemon, database, or external sandbox"

  - id: distinct-turn-contract-approval
    prompt: "@Click 모델이 계약을 보여준 같은 turn에서 스스로 pass하지 못하게 고쳐줘."
    default_mode: on
    expected_activation: true
    expected_mode: build
    expected_mutation_gate: none-before-approval
    directive_semantics:
      - "Records the staging UserPromptSubmit turn outside the repository"
      - "Rejects same-turn pass and same-turn replacement stage"
      - "Requires the pass tool call to use only the exact emitted contract_id in a later UserPromptSubmit turn and binds it to the stored digest"
      - "Allows implementation to continue without another approval after that pass"
    minimality_expectations:
      reuse: "The existing session contract and prompt Hook event"
      reject_without_evidence:
        - "Natural-language approval classification, an MCP service, or extra approval phases"

  - id: active-lifecycle-plan-block
    prompt: "@Click 계약이 active인 동안 update_plan으로 별도 계획을 만들지 못하게 고쳐줘."
    default_mode: on
    expected_activation: true
    expected_mode: build
    expected_mutation_gate: none-before-approval
    directive_semantics:
      - "Blocks both plan tool names in armed, staged, passed, and review turns"
      - "Uses session contract state to keep blocking in later turns while staging or implementation is incomplete"
      - "Allows ordinary planning after bypass or current-revision completion"
      - "Does not add a second plan representation"
    minimality_expectations:
      reuse: "The existing per-turn and session contract state"
      reject_without_evidence:
        - "A new plan ledger or semantic planning service"

  - id: manual-session-mutation-lock
    prompt: "@Click Manual 모드에서 계약을 승인했어. pass하기 전에 다음 turn에서 코드를 먼저 바꾸지 못하게 해줘."
    default_mode: manual
    expected_activation: true
    expected_mode: build
    expected_mutation_gate: session-active-before-pass
    directive_semantics:
      - "Blocks apply_patch and write-capable Bash in a later turn while the Manual session contract is staged"
      - "Keeps an approved but incomplete Manual contract locked until the same emitted contract_id is passed in the active turn"
      - "Leaves ordinary Manual work fail-open when no Click contract is active"
      - "Preserves per-turn bypass and one-shot implementation after pass"
    minimality_expectations:
      reuse: "The existing session contract completion predicate"
      reject_without_evidence:
        - "A new lifecycle state, extra approval round, or repository-local lock file"

  - id: verification-scope-classification
    prompt: "@Click pytest filter와 파일 여러 개로 전체 테스트 비용을 targeted처럼 속이지 못하게 하고, 정확한 integration test 하나는 deep으로 과차단하지 마."
    default_mode: on
    expected_activation: true
    expected_mode: build
    expected_mutation_gate: none-before-approval
    directive_semantics:
      - "Classifies filters, regexes, multiple targets, directories, and suites as at least broad"
      - "Classifies one exact integration or security node as broad and the whole corresponding suite as deep"
      - "Recognizes py -3 -m, uv, lint, build, typecheck, Cargo check/clippy, and Go vet forms"
      - "Preserves one verification request and one-shot implementation"
    minimality_expectations:
      reuse: "The existing argv validator and verification class table"
      reject_without_evidence:
        - "A regex policy engine, external classifier, dependency, or user prompt per command"

  - id: verification-new-source-path
    prompt: "@Click 검증 중 src나 migration 아래 새 파일을 만들고도 성공하는 경우를 막되 일반 report 파일 때문에 실패시키지는 마."
    default_mode: on
    expected_activation: true
    expected_mode: build
    expected_mutation_gate: none-before-approval
    directive_semantics:
      - "Reports every new non-ignored untracked path after verification"
      - "Fails stale for new source, application, library, configuration, or migration paths"
      - "Fails stale for every new non-ignored path while using source/configuration classification only to clarify the warning"
      - "States that Git-ignored paths are not protected by this snapshot"
    minimality_expectations:
      reuse: "Git's non-ignored untracked inventory and the existing before/after snapshot"
      reject_without_evidence:
        - "A filesystem watcher, artifact database, daemon, or large allowlist"

  - id: cheapest-evidence-browser-game
    prompt: "@Click 10개 웨이브와 승리·패배, 데스크톱·모바일 조작을 갖춘 브라우저 타워 디펜스 게임을 한 번에 구현해줘."
    default_mode: on
    expected_activation: true
    expected_mode: build
    expected_mutation_gate: none-before-approval
    directive_semantics:
      - "Declares each evidence source once and assigns every done_when condition one cheapest sufficient primary_evidence id while allowing one id to cover several conditions"
      - "Uses deterministic game-logic tests for waves, rewards, damage, victory, and defeat instead of replaying the whole timed campaign"
      - "Uses one representative browser session only for integration, input, responsive layout, and visual behavior that logic tests cannot prove"
      - "Declares one referenced evidence source with kind browser and stays within three serial calls, 90 measured seconds, and five-second explicit waits"
      - "Does not duplicate the same rule through both automated and browser evidence or add a shadow verification suite"
      - "Stops verification as soon as every declared primary source has current evidence"
    minimality_expectations:
      reuse: "The game core's deterministic state and one continuous browser session"
      reject_without_evidence:
        - "A natural ten-wave victory playthrough followed by a separate full defeat playthrough"
        - "Repeated desktop and mobile checks of rules already proven by automated tests"
        - "More than three Browser calls, a Browser timeout above 30 seconds, or a timed wait above five seconds"
